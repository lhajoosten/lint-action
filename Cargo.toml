[package]
name = "lint-action"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/lhajoosten/lint-action"
rust-version = "1.88"
description = "Tree-sitter quality gate for source complexity and duplication"

[dependencies]
clap = { version = "=4.5.50", features = ["derive"] }
globset = "=0.4.18"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tree-sitter = "=0.25.10"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
walkdir = "=2.5.0"
