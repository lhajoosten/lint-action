[package]
name = "lint-gate"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/lhajoosten/lint-gate"
rust-version = "1.88"
description = "Tree-sitter quality gate for source complexity and duplication"

[dependencies]
clap = { version = "=4.5.50", features = ["derive"] }
globset = "=0.4.18"
regex = "=1.13.2"
ring = "=0.17.14"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
tree-sitter = "=0.25.10"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"] }
walkdir = "=2.5.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[test]]
name = "action-fixture"
path = "tests/action_fixture.rs"
harness = false
