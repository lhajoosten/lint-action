name: lint-action
description: Run the Tree-sitter quality gate on a checked-out repository
inputs:
  repository:
    description: Path to the repository relative to GITHUB_WORKSPACE
    default: "."
  policy-directory:
    description: Absolute path to trusted policy files outside GITHUB_WORKSPACE
    default: ""
  policy-ref:
    description: Optional trusted full Git object ID, overriding the default PR base
    default: ""
outputs:
  report:
    description: Absolute path to the complete JSON report
    value: ${{ steps.gate.outputs.report }}
runs:
  using: composite
  steps:
    - name: Build lint-action
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        rustup toolchain install 1.88.0 --profile minimal
        cargo +1.88.0 build --locked --release --target-dir "$RUNNER_TEMP/lint-action-build"
    - name: lint-action quality gate
      id: gate
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        LINT_ACTION_REPOSITORY: ${{ inputs.repository }}
        LINT_ACTION_POLICY_DIRECTORY: ${{ inputs.policy-directory }}
        LINT_ACTION_POLICY_REF: ${{ inputs.policy-ref }}
        LINT_ACTION_PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: python3 -I action/run.py "$RUNNER_TEMP/lint-action-build/release/lint-action"
