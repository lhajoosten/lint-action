name: Publish Lint Gate App check

on:
  workflow_call:
    inputs:
      enabled:
        description: Enable advisory GitHub App publication
        type: boolean
        default: false
      publish-conversations:
        description: Independently rescan and publish PR review conversations
        type: boolean
        default: false
      app-id:
        description: Numeric GitHub App ID
        type: string
        default: ''
      source-workflow:
        description: Filename of the PR analysis caller in .github/workflows
        type: string
        required: true
      scanner-workflow:
        description: Full reusable scanner path with a commit SHA or protected refs/heads ref
        type: string
        required: true
      analysis-job:
        description: Exact Actions display name for the reusable analysis job
        type: string
        default: complexity / complexity
    secrets:
      app-private-key:
        description: GitHub App PEM private key

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  advisory:
    if: >-
      inputs.enabled && !inputs.publish-conversations && github.event_name == 'workflow_run' &&
      github.event.action == 'completed' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: lint-gate-advisory-publisher
      queue: max
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify App configuration
        env:
          APP_ID: ${{ inputs.app-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure the numeric LINT_GATE_APP_ID and the LINT_GATE_APP_PRIVATE_KEY secret, or disable publishing.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Create the repository-scoped installation token
        id: installation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-checks: write
      - name: Explain installation failures
        if: failure() && steps.installation.outcome == 'failure'
        run: echo '::error::Verify the App ID and private key match and the App is installed with Checks write permission.'
      - name: Publish the advisory check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.installation.outputs.token }}
          APP_ID: ${{ inputs.app-id }}
          SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
          SCANNER_WORKFLOW: ${{ inputs.scanner-workflow }}
          ANALYSIS_JOB: ${{ inputs.analysis-job }}
        run: python3 -Es action/publish_advisory.py

  scan:
    if: >-
      inputs.enabled && inputs.publish-conversations && github.event_name == 'workflow_run' &&
      github.event.action == 'completed' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      pull_request: ${{ steps.verify.outputs.pull_request }}
      revision: ${{ steps.verify.outputs.revision }}
      base: ${{ steps.verify.outputs.base }}
      head: ${{ steps.verify.outputs.head }}
      source_run: ${{ steps.verify.outputs.source_run }}
      source_attempt: ${{ steps.verify.outputs.source_attempt }}
      scanner_repository: ${{ steps.verify.outputs.scanner_repository }}
      scanner_sha: ${{ steps.verify.outputs.scanner_sha }}
      details_url: ${{ steps.verify.outputs.details_url }}
      scan_complete: ${{ steps.ready.outputs.complete }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
      source_outcome: ${{ steps.verify.outputs.source_outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: publisher-tool
          persist-credentials: false
      - name: Verify the completed scan and current PR
        id: verify
        working-directory: publisher-tool
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
          SCANNER_WORKFLOW: ${{ inputs.scanner-workflow }}
          ANALYSIS_JOB: ${{ inputs.analysis-job }}
        run: python3 -Es action/prepare_pr_scan.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.verify.outputs.ready == 'true' && steps.verify.outputs.scan_complete == 'true'
        with:
          repository: ${{ steps.verify.outputs.scanner_repository }}
          ref: ${{ steps.verify.outputs.scanner_sha }}
          path: scanner-tool
          persist-credentials: false
      - name: Materialize the verified PR merge tree
        if: steps.verify.outputs.ready == 'true' && steps.verify.outputs.scan_complete == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.verify.outputs.revision }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Build the trusted scanner
        if: steps.verify.outputs.ready == 'true' && steps.verify.outputs.scan_complete == 'true'
        working-directory: scanner-tool
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 build --locked --release --target-dir "$RUNNER_TEMP/lint-gate-build"
      - name: Independently scan the verified PR merge tree
        id: rescan
        if: steps.verify.outputs.ready == 'true' && steps.verify.outputs.scan_complete == 'true'
        continue-on-error: true
        working-directory: scanner-tool
        env:
          LINT_GATE_REPOSITORY: candidate
          LINT_GATE_PR_BASE: ${{ steps.verify.outputs.base }}
        run: python3 -I action/run.py "$RUNNER_TEMP/lint-gate-build/release/lint-gate"
      - name: Mark the independent scan complete
        id: ready
        if: steps.rescan.outputs.outcome == '0' || steps.rescan.outputs.outcome == '1'
        run: echo 'complete=true' >> "$GITHUB_OUTPUT"
      - name: Stage trusted scan evidence
        id: stage
        if: steps.rescan.outputs.outcome == '0' || steps.rescan.outputs.outcome == '1'
        env:
          VERIFIED_REVISION: ${{ steps.verify.outputs.revision }}
          VERIFIED_BASE: ${{ steps.verify.outputs.base }}
          VERIFIED_HEAD: ${{ steps.verify.outputs.head }}
          SOURCE_RUN: ${{ steps.verify.outputs.source_run }}
          SOURCE_ATTEMPT: ${{ steps.verify.outputs.source_attempt }}
        run: python3 -Es publisher-tool/action/stage_evidence.py "${{ steps.rescan.outputs.report }}" candidate
      - name: Upload trusted scan evidence
        id: upload
        if: >-
          steps.rescan.outputs.outcome == '0' || steps.rescan.outputs.outcome == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ runner.temp }}/lint-gate-findings
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: scan
    if: >-
      inputs.enabled && inputs.publish-conversations && needs.scan.result == 'success' &&
      needs.scan.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: lint-gate-pr-feedback-${{ needs.scan.outputs.pull_request }}
      queue: max
    steps:
      - name: Verify App configuration
        env:
          APP_ID: ${{ inputs.app-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure the numeric LINT_GATE_APP_ID and the LINT_GATE_APP_PRIVATE_KEY secret, or disable publishing.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Download trusted scan evidence
        if: needs.scan.outputs.scan_complete == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.3.0
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact_id }}
          path: ${{ runner.temp }}/lint-gate-findings
      - name: Create the repository-scoped installation token
        if: inputs.enabled
        id: installation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-checks: write
          permission-pull-requests: write
      - name: Explain installation failures
        if: failure() && steps.installation.outcome == 'failure'
        run: echo '::error::Verify the App ID and private key match and the App is installed with Checks and Pull requests write permissions.'
      - name: Publish PR conversations and the advisory check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.installation.outputs.token }}
          APP_ID: ${{ inputs.app-id }}
          APP_SLUG: ${{ steps.installation.outputs.app-slug }}
          SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
          SCANNER_WORKFLOW: ${{ inputs.scanner-workflow }}
          ANALYSIS_JOB: ${{ inputs.analysis-job }}
          FINDINGS_REPORT: ${{ runner.temp }}/lint-gate-findings/report.json
          FINDINGS_MANIFEST: ${{ runner.temp }}/lint-gate-findings/anchors.json
          FINDINGS_ARTIFACT_NAME: ${{ needs.scan.outputs.artifact_name }}
          PULL_REQUEST: ${{ needs.scan.outputs.pull_request }}
          VERIFIED_REVISION: ${{ needs.scan.outputs.revision }}
          VERIFIED_BASE: ${{ needs.scan.outputs.base }}
          VERIFIED_HEAD: ${{ needs.scan.outputs.head }}
          SOURCE_RUN: ${{ needs.scan.outputs.source_run }}
          SOURCE_ATTEMPT: ${{ needs.scan.outputs.source_attempt }}
          VERIFIED_SCANNER_REPOSITORY: ${{ needs.scan.outputs.scanner_repository }}
          VERIFIED_SCANNER_SHA: ${{ needs.scan.outputs.scanner_sha }}
          DETAILS_URL: ${{ needs.scan.outputs.details_url }}
          SOURCE_OUTCOME: ${{ needs.scan.outputs.source_outcome }}
          SCAN_COMPLETE: ${{ needs.scan.outputs.scan_complete }}
        run: python3 -Es action/publish.py
