name: Rolling Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-log-consumer-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  preview:
    name: Preview with Rolling Release latest
    if: >-
      github.event.pull_request.merged == true &&
      vars.RELEASE_APP_ID != '' &&
      vars.RELEASE_BOT_USER_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_LOG_IMAGE: ghcr.io/lhajoosten/release-log:latest
      RELEASE_LOG_CONFIGURATION: &release_config |-
        {
          "schemaVersion": 2,
          "repository": "${{ github.repository }}",
          "repositoryId": 1466479881,
          "releaseBranch": "main",
          "releasePolicy": "release-policy-v1",
          "contextPolicy": "required",
          "githubRelease": true,
          "changelog": {
            "verbosity": "concise",
            "format": "compact"
          },
          "bootstrap": {
            "baselineSha": "a193349202c0e5263633ffef801a0efac48ab684",
            "onboardingSha": "21e9907854c25f24062ddb0c399600bb7f360843"
          }
        }
    steps:
      - name: Check out main and complete tag history as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Pull the latest stable CLI
        run: docker pull --platform linux/amd64 "$RELEASE_LOG_IMAGE"

      - name: Prepare trusted release inputs
        env:
          RELEASE_BOT_USER_ID: ${{ vars.RELEASE_BOT_USER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-log-inputs"
          printf '%s\n' "$RELEASE_LOG_CONFIGURATION" > "$RUNNER_TEMP/release-log-inputs/config.json"
          jq -n --argjson bot "$RELEASE_BOT_USER_ID" \
            '{schemaVersion: 1, botUserId: $bot}' > "$RUNNER_TEMP/release-log-inputs/automation.json"
          cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/release-log-inputs/event.json"

      - name: Make the reviewed replay packages available to the preview
        env:
          REPLAY_IMAGES: |-
            [
              {
                "sha": "21662200936919c1df83f9d3ce8fccee42fa3dc4",
                "digest": "8da2381cb6192ac27729508e6743a402909d2baceda13ba72964c062ffd5311e",
                "legacy": false
              }
            ]
        run: |
          active=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RELEASE_LOG_IMAGE")
          [[ "$active" =~ ^[a-f0-9]{40}$ ]]
          input_dir="$RUNNER_TEMP/release-log-inputs"
          history=$(jq -c --arg active "$active" 'map(select(.sha != $active))' <<< "$REPLAY_IMAGES")
          while IFS=$'\t' read -r sha digest; do
            image="ghcr.io/lhajoosten/release-log@sha256:$digest"
            docker pull --platform linux/amd64 "$image"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$sha"
            container=$(docker create --platform linux/amd64 "$image")
            trap 'docker rm "$container" >/dev/null' EXIT
            mkdir -p "$input_dir/producers/$sha"
            docker cp "$container:/opt/release-log/." "$input_dir/producers/$sha"
            docker rm "$container" >/dev/null
            trap - EXIT
          done < <(jq -r '.[] | [.sha, .digest] | @tsv' <<< "$history")
          jq -n --arg active "$active" --argjson history "$history" \
            '{activeSha: $active, producers: [$history[] | {sha, legacy, directory: ("/inputs/producers/" + .sha)}]}' \
            > "$input_dir/producers.json"

      - name: Mint a read-only preview token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY || secrets.RELEASE_LOG_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read

      - name: Preview the release
        env:
          RELEASE_LOG_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          docker run --rm --platform linux/amd64 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,src=$GITHUB_WORKSPACE/source,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/release-log-inputs,dst=/inputs,readonly" \
            -e RELEASE_LOG_APP_TOKEN -e GITHUB_EVENT_NAME \
            "$RELEASE_LOG_IMAGE" roll \
            --producer-runtimes /inputs/producers.json \
            --config /inputs/config.json --automation /inputs/automation.json \
            --repository /source --event /inputs/event.json --dry-run

  write-release:
    name: Verify and write the release
    needs: preview
    # The writer re-reads GitHub and never consumes preview outputs or artifacts.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        vars.RELEASE_APP_ID != '' &&
        vars.RELEASE_BOT_USER_ID != '' &&
        vars.RELEASE_LOG_WRITE_ENABLED == 'true'))
    uses: lhajoosten/rolling-release/.github/workflows/rolling-release.yml@21662200936919c1df83f9d3ce8fccee42fa3dc4
    with:
      tool-sha: "21662200936919c1df83f9d3ce8fccee42fa3dc4"
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      write: ${{ github.event_name != 'workflow_dispatch' }}
      configuration: *release_config
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY || secrets.RELEASE_LOG_PRIVATE_KEY }}
