name: Rolling Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-log-consumer-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  release:
    uses: lhajoosten/rolling-release/.github/workflows/consumer-release.yml@f74198ff778b132dddc5a6440f230fd6b5be8ce8
    with:
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      write-enabled: ${{ vars.RELEASE_LOG_WRITE_ENABLED != 'false' }}
      replay-history: >-
        [
          {"sha":"21662200936919c1df83f9d3ce8fccee42fa3dc4","legacy":false,"digest":"8da2381cb6192ac27729508e6743a402909d2baceda13ba72964c062ffd5311e"}
        ]
      configuration: >-
        {
          "schemaVersion": 2,
          "repository": "${{ github.repository }}",
          "repositoryId": 1466479881,
          "releaseBranch": "main",
          "releasePolicy": "release-policy-v2",
          "contextPolicy": "required",
          "githubRelease": true,
          "changelog": {
            "verbosity": "concise",
            "format": "compact"
          },
          "bootstrap": {
            "baselineSha": "a193349202c0e5263633ffef801a0efac48ab684",
            "onboardingSha": "21e9907854c25f24062ddb0c399600bb7f360843"
          }
        }
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY || secrets.RELEASE_LOG_PRIVATE_KEY }}
