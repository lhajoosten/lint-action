name: Rolling release

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-log-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      vars.RELEASE_APP_ID != '' &&
      vars.RELEASE_BOT_USER_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_LOG_IMAGE: ghcr.io/lhajoosten/release-log:latest
      RELEASE_LOG_CONFIGURATION: |-
        {
          "schemaVersion": 2,
          "repository": "lhajoosten/lint-action",
          "repositoryId": 1466479881,
          "releaseBranch": "main",
          "releasePolicy": "release-policy-v1",
          "contextPolicy": "required",
          "githubRelease": true,
          "changelog": {
            "verbosity": "concise",
            "format": "compact"
          },
          "bootstrap": {
            "baselineSha": "a193349202c0e5263633ffef801a0efac48ab684",
            "onboardingSha": "21e9907854c25f24062ddb0c399600bb7f360843"
          }
        }
    steps:
      - name: Check out main and complete tag history as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Pull the latest stable CLI
        run: docker pull --platform linux/amd64 "$RELEASE_LOG_IMAGE"

      - name: Prepare trusted release inputs
        env:
          RELEASE_BOT_USER_ID: ${{ vars.RELEASE_BOT_USER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-log-inputs"
          printf '%s\n' "$RELEASE_LOG_CONFIGURATION" > "$RUNNER_TEMP/release-log-inputs/config.json"
          jq -n --argjson bot "$RELEASE_BOT_USER_ID" \
            '{schemaVersion: 1, botUserId: $bot}' > "$RUNNER_TEMP/release-log-inputs/automation.json"
          cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/release-log-inputs/event.json"

      - name: Mint a repository-scoped App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_LOG_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read

      - name: Run Release Log
        env:
          RELEASE_LOG_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          docker run --rm --platform linux/amd64 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,src=$GITHUB_WORKSPACE/source,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/release-log-inputs,dst=/inputs,readonly" \
            -e RELEASE_LOG_APP_TOKEN -e GITHUB_EVENT_NAME \
            "$RELEASE_LOG_IMAGE" roll \
            --config /inputs/config.json --automation /inputs/automation.json \
            --repository /source --event /inputs/event.json --dry-run
