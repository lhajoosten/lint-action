name: Rolling release

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    uses: lhajoosten/release-log/.github/workflows/rolling-release.yml@cc0161772f51b637cad637a6d4f4a0447c1e3a5e
    with:
      tool-sha: cc0161772f51b637cad637a6d4f4a0447c1e3a5e
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      write: false
      configuration: >-
        {"schemaVersion":2,
        "repository":"lhajoosten/lint-action",
        "repositoryId":1466479881,
        "releaseBranch":"main",
        "releasePolicy":"release-policy-v1",
        "contextPolicy":"required",
        "githubRelease":true,
        "changelog":{"verbosity":"concise","format":"compact"},
        "bootstrap":{
        "baselineSha":"a193349202c0e5263633ffef801a0efac48ab684",
        "onboardingSha":"21e9907854c25f24062ddb0c399600bb7f360843"}}
    secrets:
      app-private-key: ${{ secrets.RELEASE_LOG_PRIVATE_KEY }}
