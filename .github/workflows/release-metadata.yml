name: Release Log metadata

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-log-pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-log:
    uses: lhajoosten/rolling-release/.github/workflows/release-metadata.yml@f74198ff778b132dddc5a6440f230fd6b5be8ce8
    with:
      tool-sha: f74198ff778b132dddc5a6440f230fd6b5be8ce8
      configuration: >-
        {
          "schemaVersion": 2,
          "repository": "${{ github.repository }}",
          "repositoryId": 1466479881,
          "releaseBranch": "main",
          "releasePolicy": "release-policy-v2",
          "contextPolicy": "required",
          "githubRelease": true,
          "changelog": {
            "verbosity": "concise",
            "format": "compact"
          },
          "bootstrap": {
            "baselineSha": "a193349202c0e5263633ffef801a0efac48ab684",
            "onboardingSha": "21e9907854c25f24062ddb0c399600bb7f360843"
          }
        }
